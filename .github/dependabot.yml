# Version-update PRs for the three manifests (security-update PRs and alerts are separate repo settings, already on).
# Weekly and grouped so a week of updates is one PR per ecosystem. Majors are left alone for the pinned data stack:
# requirements.txt caps dbt and duckdb on purpose (see the comments there), so a major bump is a person's decision.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: dbt-core
        update-types: [version-update:semver-major]
      - dependency-name: dbt-duckdb
        update-types: [version-update:semver-major]
      - dependency-name: duckdb
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /dashboard
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      dashboard-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

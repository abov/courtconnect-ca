# Publishes the static map (app/) to GitHub Pages (Settings > Pages > Source: GitHub Actions). The page and its data file are public once published.
# Also rebuilds daily (the dashboard pulls live issue counts). Runs on every push to main that touches app/** (page, data, assets) or this file, and by hand from the Actions tab (e.g. after a transform/ change that should reach the dbt docs).
name: pages
on:
  push:
    branches: [main]
    paths: ['app/**', 'dashboard/**', 'docs/data_quality_trend.csv', 'docs/feedback_log.csv', 'docs/usage_daily.csv', 'docs/usage_events.csv', 'docs/ml_metrics.csv', 'docs/review_priority.csv', 'docs/reader_pilot_results.csv', 'docs/search_interest_vs_coverage.csv', 'ingestion/export_dashboard_data.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'   # daily rebuild so the dashboard's live issue counts never go stale
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      # dbt docs (lineage + data dictionary) built from the small CI fixture data; structure only, no venue data is published here.
      - run: pip install dbt-core dbt-duckdb "duckdb<2" pandas python-dotenv
      - run: python ingestion/load_raw.py --data-dir ci/fixtures
      - run: dbt deps --project-dir transform --profiles-dir transform
      - run: dbt build --project-dir transform --profiles-dir transform
      - run: dbt docs generate --project-dir transform --profiles-dir transform
      - run: mkdir -p app/dbt-docs && cp transform/target/index.html transform/target/manifest.json transform/target/catalog.json app/dbt-docs/
      # Scorecard dashboard (Evidence.dev, dashboard/README.md): reads only aggregate counts and trends from committed files, no venue rows.
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      # Live site views: with the GOATCOUNTER_API_TOKEN repo secret set, pull fresh daily counts into the runner's docs/usage_daily.csv (not committed).
      # No secret, or GoatCounter down: the committed file is used and the deploy goes on.
      - name: Refresh site views from GoatCounter
        env: {GOATCOUNTER_API_TOKEN: "${{ secrets.GOATCOUNTER_API_TOKEN }}", COURTCONNECT_DATA_DIR: "${{ runner.temp }}"}
        run: |
          if [ -z "$GOATCOUNTER_API_TOKEN" ]; then echo "no GOATCOUNTER_API_TOKEN secret; using committed docs/usage_daily.csv"; exit 0; fi
          pip install requests
          python ingestion/extract_goatcounter.py && python ingestion/usage_daily.py || echo "::warning::GoatCounter refresh failed; using committed docs/usage_daily.csv"
      - run: python ingestion/export_dashboard_data.py
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: npm ci --ignore-scripts
        working-directory: dashboard
      - run: npm run sources && npm run build
        working-directory: dashboard
      - run: mkdir -p app/dashboard && cp -r dashboard/build/. app/dashboard/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: app}
      - id: deployment
        uses: actions/deploy-pages@v4

# Publishes the static map (app/) to GitHub Pages. Manual only: run it from the Actions tab after Pages is enabled
# (Settings > Pages > Source: GitHub Actions). The page and its data file are public once published.
name: pages
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: app}
      - id: deployment
        uses: actions/deploy-pages@v4

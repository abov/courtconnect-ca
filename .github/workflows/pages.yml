# Publishes the static map (app/) to GitHub Pages (Settings > Pages > Source: GitHub Actions). The page and its data file are public once published.
# Also rebuilds daily (the dashboard pulls live issue counts). Runs on every push to main that touches app/** (page, data, assets) or this file, and by hand from the Actions tab (e.g. after a transform/ change that should reach the dbt docs).
name: pages
on:
  push:
    branches: [main]
    paths: ['app/**', 'dashboard/**', 'transform/**', 'ci/**', 'docs/decisions/**', 'docs/agent_log.csv', 'ingestion/build_stats.py', 'docs/data_quality_trend.csv', 'docs/feedback_log.csv', 'docs/usage_daily.csv', 'docs/usage_events.csv', 'docs/ml_metrics.csv', 'docs/review_priority.csv', 'docs/reader_pilot_results.csv', 'docs/search_interest_vs_coverage.csv', 'ingestion/export_dashboard_data.py', 'ingestion/split_app_data.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'   # daily rebuild so the dashboard's live issue counts never go stale
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  # Build and deploy are separate jobs (GitHub's standard Pages layout): deploy-pages reads the artifact list right after the upload,
  # and in one job that read sometimes came back empty ("No artifacts named github-pages", 2026-11-20..24) though the upload had worked.
  # A separate job also lets "Re-run failed jobs" redeploy without uploading a second copy (a full re-run hit "Multiple artifacts").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      # dbt docs (lineage + data dictionary) built from the small CI fixture data; structure only, no venue data is published here.
      - run: pip install -r requirements.txt
      - run: python ingestion/load_raw.py --data-dir ci/fixtures
      - run: dbt deps --project-dir transform --profiles-dir transform
      - run: dbt build --project-dir transform --profiles-dir transform
      - run: dbt docs generate --project-dir transform --profiles-dir transform
      - run: mkdir -p app/dbt-docs && cp transform/target/index.html transform/target/manifest.json transform/target/catalog.json app/dbt-docs/
      # Scorecard dashboard (Evidence.dev, dashboard/README.md): reads only aggregate counts and trends from committed files, no venue rows.
      - uses: actions/setup-node@v7
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      # Live site views: with the GOATCOUNTER_API_TOKEN repo secret set, pull fresh daily counts into the runner's docs/usage_daily.csv (not committed).
      # No secret, or GoatCounter down: the committed file is used and the deploy goes on.
      - name: Refresh site views from GoatCounter
        env: {GOATCOUNTER_API_TOKEN: "${{ secrets.GOATCOUNTER_API_TOKEN }}", COURTCONNECT_DATA_DIR: "${{ runner.temp }}"}
        run: |
          if [ -z "$GOATCOUNTER_API_TOKEN" ]; then echo "no GOATCOUNTER_API_TOKEN secret; using committed docs/usage_daily.csv"; exit 0; fi
          pip install requests
          python ingestion/extract_goatcounter.py && python ingestion/usage_daily.py || echo "::warning::GoatCounter refresh failed; using committed docs/usage_daily.csv"
      # Rebuild the counts on how-its-built.html, run-history.html and the dashboard from the repo as it is now, so they never trail the code (not committed).
      - run: python ingestion/build_stats.py --keep-gold
      - run: python ingestion/export_dashboard_data.py
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: npm ci --ignore-scripts
        working-directory: dashboard
      - run: npm run sources && npm run build
        working-directory: dashboard
      - run: mkdir -p app/dashboard && cp -r dashboard/build/. app/dashboard/
      # The map loads venues.json in two parts: map.json (pins, list, search, filters) first, details.json after. Not committed; the test checks they rebuild venues.json exactly.
      - run: python ingestion/split_app_data.py && node ci/test_split_data.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: {path: app}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # One retry after a pause, for the same empty-artifact-list glitch; a real failure fails here too.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

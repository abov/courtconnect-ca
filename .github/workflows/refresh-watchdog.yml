name: Refresh watchdog

# Dead-man's switch for the twice-monthly scheduled chain (local tasks or cloud
# routines). The chain runs on the 1st and 15th; on the 2nd and 16th this checks
# that a "Tournaments ..." PR was opened in the last 3 days. If not, the job
# fails, and GitHub emails the failure to whoever last edited this schedule.
on:
  schedule:
    - cron: '0 18 2,16 * *'
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look for this cycle's tournament PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 30 \
            --json title,createdAt \
            --jq "[.[] | select(.createdAt >= \"$since\" and (.title | startswith(\"Tournaments\")))] | length")
          echo "Tournament PRs since $since: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::No 'Tournaments' PR in the last 3 days: the scheduled chain did not run or stopped early. Check docs/cloud_routines.md and the scheduled-tasks list."
            exit 1
          fi

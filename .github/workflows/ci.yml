name: ci
on: [push, pull_request]
jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install dbt-core dbt-duckdb duckdb pandas python-dotenv
      # CI never calls OpenStreetMap or Snowflake: it loads a small committed sample of real OSM data
      # (ci/fixtures, Pasadena area) and builds + tests the entire project on DuckDB.
      - run: python ingestion/load_raw.py --data-dir ci/fixtures
      - run: dbt build --project-dir transform --profiles-dir transform

name: issue-to-pr
# A reviewer adds the "approved" label to a "Suggest a change" issue; this opens a pull request that edits one seed row.
# Only people with triage/write access can add labels, so the label is the approval. The issue text is untrusted: it reaches
# the script through environment variables only, never through shell interpolation.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  open-pr:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'venue-change')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - id: edit
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set +e
          python ci/issue_to_pr.py > result.txt
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Explain a rejected issue
        if: steps.edit.outputs.code != '0'
        env: {GH_TOKEN: "${{ github.token }}", NUM: "${{ github.event.issue.number }}"}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "Could not turn this into a data change. $(cat result.txt) Edit the issue and re-add the approved label."
      - name: Check evidence rules
        if: steps.edit.outputs.code == '0'
        run: python ci/check_seed_evidence.py
      - name: Open the pull request
        if: steps.edit.outputs.code == '0'
        env: {GH_TOKEN: "${{ github.token }}", NUM: "${{ github.event.issue.number }}"}
        run: |
          branch="suggest/issue-$NUM"
          git config user.name "courtconnect-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add transform/seeds
          git commit -m "Apply suggestion from issue #$NUM: $(cat result.txt)"
          git push origin "$branch"
          gh pr create --title "Apply suggestion from issue #$NUM" --head "$branch" \
            --body "Closes #$NUM. Edit made automatically from the approved issue: $(cat result.txt). Check the evidence and source link, then merge. dbt-build must pass."
          # Pushes made with GITHUB_TOKEN do not start the ci workflow, so start it by hand so the required dbt-build check reports.
          gh workflow run ci.yml --ref "$branch"

version: 2

exposures:
  - name: courtconnect_map
    label: CourtConnect CalNeva map
    type: application
    maturity: medium
    url: https://abov.github.io/courtconnect-ca/
    description: >
      Static MapLibre map of racket-sport venues in California and Nevada (CalNeva; Nevada data not loaded yet). Reads app/data/venues.json, exported from the marts by
      ingestion/export_app_data.py (checked fresh in CI by ci/check_export_fresh.py).
    depends_on:
      - ref('mart_venue_finder')
      - ref('mart_venue_actions')
      - ref('mart_watch_events')
      - ref('mart_sport_gaps')
      - ref('dim_wall')
      - ref('mart_wall_pins')
    owner:
      name: CourtConnect maintainer
  - name: data_quality_scorecard
    label: Data quality scorecard
    type: analysis
    maturity: medium
    description: Service levels and coverage in docs/data_quality.md, generated by ingestion/export_quality_scorecard.py.
    depends_on:
      - ref('mart_venue_finder')
      - ref('mart_sport_gaps')
      - ref('mart_website_quality')
      - ref('stg_venue_actions')
      - ref('stg_watch_events')
    owner:
      name: CourtConnect maintainer

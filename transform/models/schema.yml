version: 2

seeds:
  - name: all_racquet
    description: >
      Master list of racket sports the platform supports, one row per sport. Synced from the Google Sheet
      (tab "All Raquet"; its location is kept in .env, not in the repo)
      by ingestion/sync_sports_sheet.py. Values are raw; cleaning happens in stg_sports.
    columns:
      - name: sport
        description: The racket sport. Every non-blank value must become a row in dim_sport.
        tests: [not_null]

  - name: manual_venues
    description: >
      Venues no data source knows about, added by hand, one row per (venue, sport), with what the venue offers
      (open_play, clinics, private_lessons, group_classes, drop_in, tournaments). `evidence` records how well each entry is backed up.
    columns:
      - name: venue_key
        tests: [not_null]
      - name: sport
        tests:
          - not_null
          - relationships:
              arguments: {to: "ref('all_racquet')", field: sport}
      - name: surface_type
        tests:
          - accepted_values:
              arguments:
                values: ['hard', 'clay', 'grass', 'turf', 'sand', 'carpet', 'wood', 'other', 'unknown']
      - name: setting
        tests:
          - accepted_values:
              arguments:
                values: ['indoor', 'covered', 'outdoor', 'likely_outdoor', 'unknown']
      - name: access
        tests:
          - accepted_values:
              arguments:
                values: ['public', 'unknown', 'club', 'private', 'members']   # club = a club or program, where access works through the club; private/members = members only
      - name: confirmation
        description: >
          How we know. visited = the project owner (or a named contributor) saw it in person; official = stated on the operator's or a
          government page, read on confirmed_on; reported = a third party said so (article, map, review) and it is not independently confirmed.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['visited', 'official', 'reported']

  - name: manual_venue_no_merge
    description: Hand-added venues that must stay their own pin because a different business sits within `manual_match_radius_m` (int_manual_venue_match skips them).
    columns:
      - name: venue_key
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('manual_venues')
                field: venue_key
      - name: reason
        tests: [not_null]

  - name: place_no_group
    description: Overture places that share a street address with another place but are a different business, so dim_place keeps each as its own pin.
    columns:
      - name: place_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_overture_places')
                field: place_id
      - name: reason
        tests: [not_null]

  - name: nominatim_addresses
    description: >
      Cache of Nominatim reverse geocodes for non-home pins that tiers 1-2 left without a street address. One row per pin queried,
      misses included, so a rerun never re-queries. Only status 'address' (house number + street within 150 m) is used.
    columns:
      - name: venue_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments: {values: [address, street_only, too_far, no_match, city_only]}

  - name: venue_address_official
    description: >
      Street addresses printed on a venue's own official page (park, city, club or school site), keyed by the hand-added venue_key. They
      fill a pin whose address is blank or only inferred (int_venue_address, address_source 'official'); an address tagged in OSM or
      listed by Overture is kept. Public pages only (ADR 0007); evidence says which page and when.
    columns:
      - name: venue_key
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('manual_venues')
                field: venue_key
      - name: address_line
        tests: [not_null]
      - name: evidence
        tests: [not_null]
      - name: verified_on
        tests: [not_null]

  - name: court_group_merge
    description: >
      Two OSM court groups that are one facility (a club's courts mapped more than 100 m apart), merged into one venue by int_court_pairs.
      The duplicate-venue test flags such pairs once both groups carry the same name. Keyed by OSM court id (stable; not FK-tested because the CI fixture holds only a sample of courts); evidence says how it was checked.
    columns:
      - name: court_id_a
        tests: [not_null]
      - name: court_id_b
        tests: [not_null]
      - name: evidence
        tests: [not_null]
      - name: verified_on
        tests: [not_null]

  - name: venue_name_official
    description: >
      A name for an OSM court group that no dataset names, taken from a nearby high-confidence Overture club place (100-225 m away, so
      the nearest-court rule left it unlinked), checked by hand against the pin's position (core.dim_venue, name_source 'manual').
      The name is INFERRED from position unless `evidence` says the club's own page was read. Keyed by venue_id with the pin's lat/lon: a
      row is ignored if the pin has moved. Public data only (ADR 0005, 0007).
    columns:
      - name: venue_id
        tests: [unique, not_null]
      - name: lat
        tests: [not_null]
      - name: lon
        tests: [not_null]
      - name: venue_name
        tests: [not_null]
      - name: evidence
        tests: [not_null]
      - name: verified_on
        tests: [not_null]

  - name: venue_city_official
    description: >
      City of a named pin that no dataset gives a city for (remote parks, schools, golf courses), read from the venue's own page or a
      public listing (int_venue_address, city). Keyed by venue_id with the pin's lat/lon: a row is ignored if the pin has moved. Public pages
      only (ADR 0007); evidence says which page and when.
    columns:
      - name: venue_id
        tests: [unique, not_null]
      - name: lat
        tests: [not_null]
      - name: lon
        tests: [not_null]
      - name: city
        tests: [not_null]
      - name: evidence
        tests: [not_null]
      - name: verified_on
        tests: [not_null]

  - name: venue_place_boundary
    description: >
      The US Census place (incorporated city or census-designated place) whose boundary contains a pin that no other source gives a city,
      or its county when no place does (ingestion/place_from_boundaries.py; Census cartographic boundary files, public domain). Last-resort
      city in int_venue_address; the row is ignored if the pin has moved. A county shows as "<Name> County".
    columns:
      - name: venue_id
        tests: [unique, not_null]
      - name: lat
        tests: [not_null]
      - name: lon
        tests: [not_null]
      - name: place_name
        tests: [not_null]
      - name: place_kind
        tests:
          - accepted_values:
              arguments: {values: [place, county]}
      - name: source
        tests: [not_null]
      - name: checked_on
        tests: [not_null]

  - name: website_overrides
    description: Websites a person found to be parked, hijacked or the wrong business; DNS cannot see these. They win over the automatic check.
    columns:
      - name: domain
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['dead']

  - name: sport_also_played
    description: >
      A court or place that counts for sport `sport` also counts for `also_sport` (racquetball courts host 4-wall paddle). Derived rows
      are inferred, not separately observed; bridge_place_sport labels them match_type 'also_played'.
      `exclude_private_members` = yes skips members-only venues and club-style place names; `exclude_name_inferred` = yes skips places
      whose source sport was inferred from the place name. `only_surfaces` (e.g. grass;turf) limits the derived sport to courts with one of those
      surfaces; places and courts with an unknown surface are skipped. `only_access` (e.g. public) limits the derived sport to courts and hand-added
      venues with that access; unknown-access courts and Overture places (no access data) are skipped (Table Tennis -> Micro Pickleball).

  - name: osm_court_sport_overrides
    description: >
      A person found an OpenStreetMap sport tag wrong, so that court (court_id like way/123) is not counted for that sport.
      Optional `correct_sport`: the sport the court really is (found from imagery or a public page); it then counts for that sport
      at 'osm_tag_loose' strength (needs review).

  - name: venue_confirmations
    description: >
      A log of individual confirmations of venues in manual_venues, one row per person per check (ADR 0008). `confirmed_by` is a GitHub
      handle, never a real name or contact detail. The map shows how many different people confirmed a venue. A reviewer decides when
      the count justifies raising the venue's `confirmation` level in manual_venues; this file never changes it by itself.
      `reported` rows are word-of-mouth reports (docs/community_reports_plan.md); the map does not count them as confirmations.
    columns:
      - name: venue_key
        tests: [not_null]
      - name: confirmed_by
        tests: [not_null]
      - name: method
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['visited', 'official', 'reported']

  - name: venue_opening_status
    description: >
      Hand-added venues (manual_venues, by venue_key) that are confirmed but NOT OPEN YET. The map still shows them, with a hollow pin and an
      "Opening soon" badge, because the owner wants every padel, pop tennis and beach tennis place visible. 'Opening soon' = the club's own page (or an official page) says it is coming; 'Reported: opening soon' = only a directory or press listing says so (shown as a lighter pin). Only add a venue whose own page (or an
      official page) says it is coming for 'Opening soon'; remove the row when it opens (and update the venue's `rules`). `evidence` says what the page said and `verified_on` when.
    columns:
      - name: venue_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('manual_venues')
                field: venue_key
      - name: opening_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Opening soon', 'Reported: opening soon']
      - name: evidence
        tests: [not_null]
      - name: verified_on
        tests: [not_null]

  - name: venue_leads
    description: >
      The sleuthing backlog: venues and claims reported but not yet located or confirmed. Leads are not shown on the map.
      status: new -> needs_location / needs_visit -> confirmed (added to manual_venues) | resolved | rejected.
    columns:
      - name: lead_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['new', 'needs_location', 'needs_visit', 'confirmed', 'resolved', 'rejected']
      - name: source_type
        tests:
          - accepted_values:
              arguments:
                values: ['owner', 'official_page', 'article', 'review', 'reddit', 'map', 'word_of_mouth', 'issue', 'community_form', 'other']   # issue = a GitHub issue (ci/issue_to_pr.py); community_form = ci/sync_reports.py

  - name: venue_actions
    description: >
      What you can do at a venue (join a league, take a clinic, find open play, book a lesson), as link-outs to the provider's own page.
      CourtConnect books nothing. venue_ref_type is 'manual' (venue_ref = venue_key) or 'place' (venue_ref = an Overture place_id).
    columns:
      - name: action_key
        tests: [unique, not_null]
      - name: venue_ref_type
        tests:
          - accepted_values:
              arguments:
                values: ['manual', 'place']
      - name: action_type
        tests:
          - accepted_values:
              arguments:
                values: ['open_play', 'clinic', 'private_lesson', 'group_class', 'drop_in', 'tournament', 'league', 'social_event', 'court_booking', 'club_page', 'social']
      - name: provider
        tests: [not_null]

  - name: manual_walls
    description: >
      Hitting walls for solo practice (one-wall, three-wall, backboards), curated by hand, one row per wall. Blank is_lit / free_to_use = unknown.
      `confirmation` is reported (owner) or official; coordinates may be approximate (see location_precision).
    columns:
      - name: wall_key
        tests: [unique, not_null]
      - name: wall_type
        tests: [not_null]
      - name: confirmation
        tests:
          - accepted_values:
              values: ['reported', 'official', 'tagged', 'inferred']
      - name: access
        description: "Same vocabulary as venues and courts (access_type): public, customers, private (campus programs, apartments, not open to walk-up use), members, or blank = not known."
        tests:
          - accepted_values:
              arguments:
                values: ['public', 'customers', 'private', 'members']
      - name: evidence
        tests: [not_null]

  - name: player_platforms
    description: >
      Player-matching apps and sites shown under "Find people to play with" (social phase A, ADR 0015). Link-outs only: nothing is
      scraped, no member data is stored. `evidence` quotes the public page read on `verified_on`; none of them is checked for a
      California or Nevada player pool, and the app says so.
    columns:
      - name: platform
        tests: [unique, not_null]
      - name: sports
        tests: [not_null]
      - name: url
        tests: [not_null]
      - name: evidence
        tests: [not_null]
      - name: verified_on
        tests: [not_null]

  - name: watch_events
    description: >
      Pro and amateur events people can go and watch, curated by hand, one row per event. A discovery list only:
      every row links out to the organizer; nothing is sold or booked here. `verified_on` records when the facts were last checked.
    columns:
      - name: event_key
        tests: [unique, not_null]
      - name: sport
        tests:
          - not_null
          - relationships:
              arguments: {to: "ref('all_racquet')", field: sport}
      - name: level
        tests:
          - accepted_values:
              arguments:
                values: ['pro', 'college', 'amateur', 'junior', 'exhibition']
      - name: watch_format
        tests:
          - accepted_values:
              arguments:
                values: ['in_person_ticketed', 'in_person_free', 'in_person_unconfirmed', 'watch_party', 'dome_screening', 'broadcast_only']
      - name: date_status
        tests:
          - accepted_values:
              arguments:
                values: ['confirmed', 'dates_not_confirmed']

  - name: place_sport_overrides
    description: >
      Human review of weak place-to-sport matches (see mart_places_to_review). One row per decision:
      place_id, sport (exact name from the master list), verdict ('confirm' or 'reject'), evidence (what the venue's own public page says; blank on rows from before 2026-10-14), verified_on (date checked).
    columns:
      - name: verdict
        tests:
          - accepted_values:
              arguments:
                values: ['confirm', 'reject']
      - name: place_id
        tests:
          - relationships:
              arguments: {to: "ref('stg_overture_places')", field: place_id}

  - name: sport_aliases
    description: Alternate names for sports (editable). Used to search other sources when a sport has no OSM tag.
    columns:
      - name: sport
        tests:
          - not_null
          - relationships:
              arguments: {to: "ref('all_racquet')", field: sport}

models:
  - name: stg_sports
    description: Cleaned sports reference data (typos fixed, text parsed into typed columns, de-duplicated).
    columns:
      - name: sport_id
        tests: [unique, not_null]
      - name: competitive_status
        tests:
          - accepted_values:
              arguments:
                values: ['Competitive', 'Non-Competitive', 'Unknown']

  - name: dim_sport
    description: One row per racket sport. The reference dimension for the whole platform.
    columns:
      - name: sport_id
        tests: [unique, not_null]
      - name: sport_name
        tests: [not_null]

  - name: ref_sport_fit
    description: >
      Physical sport-fit reference (INFERRED, not a venue claim): guest sport's court rectangle fits inside the host sport's
      (rotation allowed, shared surface), from the sheet's court dimensions. Not yet exported to the map.
    columns:
      - name: host_sport
        tests: [not_null]
      - name: guest_sport
        tests: [not_null]
      - name: confirmation
        tests:
          - accepted_values:
              arguments:
                values: ['inferred']

  - name: dim_court
    description: One row per physical court / sports-centre record from OpenStreetMap.
    columns:
      - name: court_id
        tests: [unique, not_null]
      - name: surface_type
        tests:
          - accepted_values:
              arguments:
                values: ['hard', 'clay', 'grass', 'turf', 'sand', 'carpet', 'wood', 'other', 'unknown']
      - name: setting
        tests:
          - accepted_values:
              arguments:
                values: ['indoor', 'covered', 'outdoor', 'likely_outdoor', 'unknown']
      - name: record_kind
        tests:
          - accepted_values:
              arguments:
                values: ['court', 'facility']
      - name: access_type
        tests:
          - accepted_values:
              arguments:
                values: ['public', 'customers', 'private', 'members', 'unknown']

  - name: bridge_court_sport
    description: Many-to-many between courts and sports.
    columns:
      - name: court_id
        tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_court')", field: court_id}
      - name: sport_id
        tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_sport')", field: sport_id}

  - name: dim_venue
    description: One row per facility, from OSM courts grouped by proximity (ADR 0003) plus Overture places (ADR 0005).
    columns:
      - name: venue_id
        tests: [unique, not_null]
      - name: venue_source
        tests:
          - accepted_values:
              arguments:
                values: ['osm', 'osm+places', 'places_only', 'manual']
      - name: indoor_basis
        description: Where has_indoor comes from. has_indoor is true/false only with a basis; null (unknown) otherwise. page_quote and footprint are reserved for later evidence.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['osm_tag', 'manual_seed', 'page_quote', 'footprint', 'unknown']
      - name: name_source
        tests:
          - accepted_values:
              arguments:
                values: ['court_name', 'operator', 'places_directory', 'manual', 'enclosing_feature', 'unnamed']
      - name: region
        description: CA or NV (ADR 0014), from the state border polygon at extract time, or the seed's region column for hand-added venues.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CA', 'NV']

  - name: stg_website_checks
    description: Website domain checks (DNS only). 'dead' means the domain definitively does not exist; 'unknown' is inconclusive.
    columns:
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['ok', 'dead', 'unknown']

  - name: mart_website_quality
    description: Dead-website rate by source and Overture confidence band.

  - name: int_manual_venue_match
    description: Links each hand-added venue to the venue it was merged into (or to itself when nothing known is within manual_match_radius_m).
    columns:
      - name: venue_key
        tests: [unique, not_null]
      - name: effective_venue_id
        description: The venue the hand-added entry ends up on. Must exist in dim_venue, or the entry would silently vanish from the map.
        tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_venue')", field: venue_id}

  - name: stg_overture_places
    description: Racket-related places from Overture Maps, closed businesses removed.
    columns:
      - name: place_id
        tests: [unique, not_null]

  - name: stg_overture_addresses
    description: Overture address points near map pins (house number + street), used only to fill pins that have no address.
    columns:
      - name: address_id
        tests: [unique, not_null]

  - name: int_venue_address
    description: >
      One row per venue: the street address to show and where it came from. Venues that already carry an address keep it
      (address_source osm = tagged on the OSM court, overture_place = the Overture place record). Venues without one get the
      nearest Overture address point within address_fill_radius_m (address_source overture_nearest, address_distance_m), else a cached
      Nominatim reverse geocode (address_source nominatim). A street printed on the venue's own official page
      (seeds/venue_address_official.csv, address_source official) beats the inferred tiers. A pin with no city gets one from the hand-added row,
      a cached Nominatim lookup, or the nearest Overture address with a city within 1 km (5 km as a last resort for remote pins, then the Census place or county containing the pin), or a person-checked city in seeds/venue_city_official.csv.
      Home-like pins (is_home_like) never get an inferred street, only a city.
    columns:
      - name: venue_id
        tests: [unique, not_null]
      - name: address_source
        tests:
          - accepted_values:
              arguments: {values: [osm, overture_place, official, osm_parent, overture_nearest, nominatim]}
      - name: address_distance_m
        description: Metres from the pin to the filled address point; only set when address_source is overture_nearest or nominatim.

  - name: dim_place
    description: One row per Overture place, linked to an OSM venue when one is within place_match_radius_m metres.
    columns:
      - name: place_id
        tests: [unique, not_null]
      - name: venue_id
        tests: [not_null]

  - name: bridge_place_sport
    description: Sports a place offers, with 'strong' or 'weak' evidence.
    columns:
      - name: evidence
        tests:
          - accepted_values:
              arguments:
                values: ['strong', 'weak']

  - name: bridge_venue_sport
    description: Which sports are played at which venue, and which source (OSM, places, or both) says so.
    columns:
      - name: venue_id
        tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_venue')", field: venue_id}
      - name: sport_id
        tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_sport')", field: sport_id}

  - name: mart_sport_gaps
    description: One row per racket sport with an honest coverage status and the recommended next data source.
    columns:
      - name: sport_name
        tests: [unique, not_null]
      - name: coverage_status
        tests:
          - accepted_values:
              arguments:
                values: ['covered', 'sparse', 'possible_only', 'tagged_none_found', 'not_found']

  - name: mart_venue_confidence
    description: >
      Rule-based confidence score per venue (0-100, method rules_v2, INFERRED): sources, hand-added evidence, real name, contact details and
      freshness, minus a penalty when sports rest on weak evidence (mart_sport_evidence), each a visible column; v1 score kept for comparison. A heuristic for ranking what to verify next, not a probability and not shown to players yet.
    columns:
      - name: venue_id
        tests: [unique, not_null]
      - name: confidence_score
        tests:
          - not_null
      - name: last_seen_on
        description: Newest date any source saw the venue (OSM extract, Overture release, hand-added confirmation, link-out check). Null when nothing dated backs the venue (e.g. an undated reported row). The 35-day freshness SLA in `make quality` reads it.
      - name: confidence_band
        tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']

  - name: mart_sport_evidence
    description: >
      Sport-evidence ladder: per (venue, sport) the strongest evidence rung (1 confirmed ... 7 derived), how many rungs agree, and whether the
      label needs review (rung 4 loose OSM tag or rung 6 name-only). Our ranking, not a claim by the venue. Not exported to the map yet.
    columns:
      - name: venue_id
        tests: [not_null]
      - name: sport_id
        tests: [not_null]
      - name: best_rung
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false

  - name: dim_wall
    description: One row per hitting wall (hand-curated plus OSM-mapped), kept apart from venues.
    columns:
      - name: access
        description: "Same vocabulary as venues (access_type); blank = not known (never read as public)."
        tests:
          - accepted_values:
              arguments:
                values: ['public', 'customers', 'private', 'members']
      - name: region
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CA', 'NV']

  - name: mart_wall_pins
    description: >
      One row per hitting-wall map pin (the app's walls). OSM walls of the same type within `wall_group_radius_m` of each other
      (a row of handball courts at a school) share one pin at their centre; `wall_count` says how many walls stand there.
    columns:
      - name: wall_key
        tests:
          - unique
          - not_null
      - name: wall_count
        tests:
          - not_null
      - name: region
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CA', 'NV']

  - name: mart_venue_finder
    description: >
      The table behind the map. One row per venue and sport (a venue with tennis and pickleball has two rows). Venues are clusters of nearby
      OpenStreetMap courts merged with Overture places and hand-curated entries (ADR 0002, 0003). Exported to app/data/venues.json by
      ingestion/export_app_data.py.
    columns:
      - name: venue_id
        description: Stable id of the venue cluster (dim_venue).
      - name: venue_name
        description: Best available name. See name_source for how trustworthy it is.
      - name: name_source
        description: "How the name was found: court_name, operator, manual and places_directory are confirmed; enclosing_feature is a guess from the park or school the courts sit in; unnamed has none."
      - name: venue_source
        description: "Where the venue comes from: osm, osm+places, places_only or manual."
      - name: sport_name
        description: Racket sport from the owner's sheet (the sheet is the source; never hand-edited).
      - name: courts_for_sport
        description: Number of mapped courts for that sport. Sports that share physical courts (see sport_also_played) are not extra courts.
      - name: is_confirmed_public
        description: True only when the data marks the courts public. False means unknown, not private.
      - name: is_members_only
        description: True when the courts are marked private or members and not marked public. Incomplete by design; an unmarked club is not flagged.
      - name: website_usable
        description: Website that passed the liveness check; dead links never reach the map.

  - name: mart_venue_actions
    description: >
      Link-outs for a venue (open play, clinics, tournaments, social accounts). CourtConnect takes no bookings or payments; every row links
      to the provider's own page and carries verified_on and evidence (ADR 0007, 0009).
    columns:
      - name: venue_id
        description: Venue the link belongs to.
      - name: action_type
        description: open_play, drop_in, clinic, league, tournament, social, club_page and so on.
      - name: is_current
        description: False once end_date has passed.

  - name: mart_watch_events
    description: Events to watch (pro and amateur tournaments, dome screenings). Link-out only, with date_status and location_precision saying how certain the data is (ADR 0006).

  - name: mart_venue_leads
    description: Open research leads (claims we have not confirmed, such as whether a club is members only). Leads are never shown as facts on the map.

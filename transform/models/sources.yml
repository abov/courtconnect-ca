version: 2

sources:
  - name: raw
    schema: raw
    description: Landing zone. Loaded by ingestion/load_raw.py into DuckDB.
    tables:
      - name: osm_courts
        description: One row per OpenStreetMap court/sports-centre element in the extracted area.
        loaded_at_field: extracted_at
        freshness:
          warn_after: {count: 7, period: day}
      - name: osm_walls
        description: Hitting walls (handball and wall courts, backboards, practice walls) mapped in OpenStreetMap. Loaded by ingestion/extract_osm_walls.py; empty until it is run.
      - name: website_checks
        description: Does each listed website's domain still exist (DNS only)? Written by ingestion/check_websites.py; empty until it is run.
      - name: google_place_ids
        description: Venue to Google place ID, nothing else (ID-only storage is what Google's terms allow). Empty until ingestion/google_place_ids.py is run.
      - name: overture_places
        description: Racket-related places from Overture Maps (CDLA-Permissive, Apache and CC0). Loaded by ingestion/extract_overture_places.py.
      - name: overture_addresses
        description: Overture Maps address points within ~440 m of a pin (CDLA-Permissive). Loaded by ingestion/extract_overture_addresses.py; empty until it is run (CI).
      - name: ask_feedback
        description: Questions visitors chose to send from the ask box (scrubbed of emails, links and phone-like numbers), one row per day and question. Loaded by ingestion/extract_ask_feedback.py + load_raw.py from the GoatCounter export; empty until `make ask-feedback` runs. Local warehouse only, never published.
      - name: osm_parents
        description: Named parks, schools, clubs and sports centres (with bounding boxes) used to name unnamed courts.

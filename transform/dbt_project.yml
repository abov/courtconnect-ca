name: courtconnect
version: "0.1.0"
config-version: 2
profile: courtconnect

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

seeds:
  courtconnect:
    +schema: raw
    all_racquet:   # master sports list, synced from the Google Sheet (tab 'All Raquet')
      +column_types:
        year_origin: varchar   # intentionally raw: values like '1500/1700'
    osm_sport_map:
      +schema: raw

models:
  courtconnect:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    core:
      +materialized: table
      +schema: core
    marts:
      +materialized: table
      +schema: marts

vars:
  expected_racket_sports: 76   # the sheet should list 76 racket sports; a warn-level test flags any gap
  venue_radius_m: 75   # courts closer than this are treated as the same facility

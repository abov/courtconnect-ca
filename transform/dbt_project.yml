name: courtconnect
version: "0.1.0"
config-version: 2
profile: courtconnect

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

seeds:
  courtconnect:
    +schema: raw
    all_racquet:   # master sports list, synced from the Google Sheet (tab 'All Raquet')
      +column_types:
        year_origin: varchar   # intentionally raw: values like '1500/1700'
    osm_sport_map:
      +schema: raw
    manual_venues:           # keep text columns as text even when a column happens to be blank or numeric-looking
      +column_types:
        courts: varchar
        access: varchar
        rules: varchar
        website: varchar
        offerings: varchar
        confirmation: varchar
        confirmed_on: varchar
        region: varchar
    venue_confirmations:     # all text; cast in staging
      +column_types:
        venue_key: varchar
        confirmed_by: varchar
        method: varchar
        confirmed_on: varchar
        evidence: varchar
    venue_leads:             # all text
      +column_types:
        noted_on: varchar
        source_url: varchar
        city: varchar
        directories_seen: varchar
    venue_actions:           # dates stay text in the seed; the staging model casts them
      +column_types:
        start_date: varchar
        end_date: varchar
        verified_on: varchar
        price_info: varchar
    manual_venue_no_merge:   # all text
      +column_types:
        venue_key: varchar
        reason: varchar
        verified_on: varchar
    place_no_group:          # all text
      +column_types:
        place_id: varchar
        reason: varchar
        verified_on: varchar
    nominatim_addresses:     # cached Nominatim reverse geocodes (ingestion/reverse_geocode_blanks.py); text, cast in int_venue_address
      +column_types:
        venue_id: varchar
        lat: varchar
        lon: varchar
        status: varchar
        address_line: varchar
        city: varchar
        distance_m: varchar
        osm_ref: varchar
        queried_on: varchar
    venue_address_official:  # all text
      +column_types:
        venue_key: varchar
        address_line: varchar
        evidence: varchar
        verified_on: varchar
    court_group_merge:     # all text
      +column_types:
        court_id_a: varchar
        court_id_b: varchar
        evidence: varchar
        verified_on: varchar
    venue_name_official:     # all text
      +column_types:
        venue_id: varchar
        lat: varchar
        lon: varchar
        venue_name: varchar
        evidence: varchar
        verified_on: varchar
    venue_city_official:     # all text
      +column_types:
        venue_id: varchar
        lat: varchar
        lon: varchar
        venue_name: varchar
        city: varchar
        evidence: varchar
        verified_on: varchar
    venue_place_boundary:    # all text
      +column_types:
        venue_id: varchar
        lat: varchar
        lon: varchar
        place_name: varchar
        place_kind: varchar
        source: varchar
        checked_on: varchar
    website_overrides:       # all text
      +column_types:
        domain: varchar
        status: varchar
        reason: varchar
        verified_on: varchar
    watch_events:            # dates stay text in the seed; the staging model casts them (same on DuckDB and Snowflake)
      +column_types:
        start_date: varchar
        end_date: varchar
        verified_on: varchar
        lat: varchar
        lon: varchar
    social_events:           # all text; dates and numbers are cast in stg_social_events
      +column_types:
        lat: varchar
        lon: varchar
        last_listed_date: varchar
        courts: varchar
        verified_on: varchar
    player_platforms:        # all text (social phase A, ADR 0015); the app shows them as a link-out list
      +column_types:
        platform: varchar
        sports: varchar
        url: varchar
        what: varchar
        price_note: varchar
        evidence: varchar
        verified_on: varchar
    manual_walls:            # all text; flags and dates are cast in stg_manual_walls
      +column_types:
        lat: varchar
        lon: varchar
        is_lit: varchar
        free_to_use: varchar
        access: varchar
        surface: varchar
        region: varchar
        near_venue_name: varchar
        reported_on: varchar
    closed_places:   # Overture places that no longer exist; staging drops them (pin the types so an empty file is not guessed as INTEGER)
      +column_types:
        place_id: varchar
        place_name: varchar
        evidence: varchar
        verified_on: varchar
    place_sport_overrides:   # starts empty: pin the types so an empty file is not guessed as INTEGER
      +column_types:
        place_id: varchar
        sport: varchar
        verdict: varchar
        evidence: varchar
        verified_on: varchar

models:
  courtconnect:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    core:
      +materialized: table
      +schema: core
    marts:
      +materialized: table
      +schema: marts

vars:
  expected_racket_sports: 81   # the sheet should list 81 racket sports; a warn-level test flags any gap
  manual_match_radius_m: 150   # a hand-added venue within this distance of a known court/place is merged into it
  place_match_radius_m: 100    # an Overture place within this distance of an OSM court is part of that venue
  place_name_match_radius_m: 300   # ...or within this distance when place and court have the same name
  place_facility_match_radius_m: 300   # ...or within this distance when the place name matches the court's park/school/centre name, or the place and the court's park/court share a street address (only for places the two rules above leave unmatched)
  place_inside_match_radius_m: 350   # inside_facility rule (int_place_venue_match): lesson/court record whose pin is inside a small park/school/centre footprint joins its nearest court within this distance
  place_inside_max_bbox_deg2: 0.0001   # ...only for footprints up to about 1 km2 (bounding boxes of campuses and big parks swallow neighbours)
  venue_radius_m: 75   # courts closer than this are treated as the same facility
  address_fill_radius_m: 150   # nearest Overture address point within this distance fills a pin that has no address (inferred)
  parent_merge_radius_m: 400   # courts inside the same named school/park/club closer than this are one facility
  wall_group_radius_m: 50   # OSM walls of the same type closer than this (a row of handball courts) share one map pin
  osm_court_duplicate_radius_m: 1.5   # two OSM pitch ways of the same sport closer than this are one drawn-twice court (stg_osm_courts keeps the lower id)
